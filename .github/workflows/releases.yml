name: Desktop Releases

# Publication is an explicit maintainer action after independent acceptance testing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing accepted version tag (do not move an existing tag)
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyInstaller==6.22.3 Pillow==12.3.0
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}(-[a-zA-Z0-9.]+)?$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - name: Build and test extracted standalone application
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/build_release.py --version "$env:RELEASE_TAG" --ref "$env:RELEASE_TAG" --output release-dist
      - uses: actions/upload-artifact@v4
        with:
          name: bunnyinfo-desktop
          path: |
            release-dist/*.zip
            release-dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: bunnyinfo-desktop
          path: release-dist
      - name: Publish and verify accepted release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          archive="BunnyInfo-${RELEASE_TAG}-Windows-x64.zip"
          (cd release-dist && sha256sum --check "$archive.sha256")
          # create fails if the release already exists; never replace accepted assets silently.
          gh release create "$RELEASE_TAG" "release-dist/$archive" "release-dist/$archive.sha256" \
            --verify-tag --title "BunnyInfo $RELEASE_TAG" --notes-file releases/current.md
          gh release download "$RELEASE_TAG" --pattern "$archive*" --dir download-check
          (cd download-check && sha256sum --check "$archive.sha256")
          cmp "release-dist/$archive" "download-check/$archive"
