name: Desktop Releases

on:
  push:
    tags: ['v2']

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v1, v2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyInstaller==6.22.3 Pillow==12.3.0
      - name: Build and test the extracted standalone application
        run: python scripts/build_release.py --version ${{ matrix.version }} --ref ${{ matrix.version }} --output release-dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.version }}
          path: |
            release-dist/*.zip
            release-dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-dist
          merge-multiple: true
      - name: Publish verified desktop attachments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for version in v1 v2; do
            (cd release-dist && sha256sum --check "Lite-PngInfo-${version}-Windows-x64.zip.sha256")
            latest=false
            if [ "$version" = v2 ]; then latest=true; fi
            gh release create "$version" \
              "release-dist/Lite-PngInfo-${version}-Windows-x64.zip" \
              "release-dist/Lite-PngInfo-${version}-Windows-x64.zip.sha256" \
              --verify-tag --title "Lite-PngInfo ${version}" \
              --notes-file "releases/${version}.md" --latest="$latest"
            gh release download "$version" \
              --pattern "Lite-PngInfo-${version}-Windows-x64.zip*" \
              --dir "download-check/${version}"
            (cd "download-check/${version}" && sha256sum --check "Lite-PngInfo-${version}-Windows-x64.zip.sha256")
            cmp "release-dist/Lite-PngInfo-${version}-Windows-x64.zip" "download-check/${version}/Lite-PngInfo-${version}-Windows-x64.zip"
          done
